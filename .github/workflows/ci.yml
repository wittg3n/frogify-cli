name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, and distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pyright
      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --locked python -c 'import os, tomllib, frogify; from pathlib import Path; version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]; assert os.environ["RELEASE_TAG"] == "v" + version == "v" + frogify.__version__, "Release tag and package versions must match"'
      - run: uv build --no-sources
      - run: uvx --from twine twine check --strict dist/*
      - name: Smoke test wheel and source distribution outside the checkout
        run: |
          for distribution in "$GITHUB_WORKSPACE"/dist/*; do
            uv run --isolated --no-project --directory "$RUNNER_TEMP" --with "$distribution" frogify --version
            uv run --isolated --no-project --directory "$RUNNER_TEMP" --with "$distribution" frogify --help
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  test:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install audio tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2
      - name: Install audio tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg aria2
      - name: Install audio tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg aria2 --yes --no-progress
      - run: uv sync --locked
      - name: Require real integration-test tools
        run: uv run --locked python -c "import shutil; missing = [tool for tool in ('ffmpeg', 'ffprobe', 'aria2c') if not shutil.which(tool)]; assert not missing, missing"
      - run: uv run --locked pytest -ra
