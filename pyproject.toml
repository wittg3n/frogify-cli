[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "frogify"
version = "0.2.0"
description = "Spotify and YouTube Music downloader CLI with smart track matching, metadata tagging, and resumable batch downloads."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "spotify",
    "spotify-downloader",
    "spotify-playlist-downloader",
    "youtube",
    "youtube-music",
    "youtube-music-downloader",
    "music-downloader",
    "playlist-downloader",
    "audio-downloader",
    "cli",
    "terminal",
    "ffmpeg",
    "metadata",
    "soundcloud",
]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1,<9",
    "mutagen>=1.47,<2",
    "platformdirs>=4.3,<5",
    "rapidfuzz>=3.10,<4",
    "requests>=2.32,<3",
    "rich>=13.9,<15",
    "typer>=0.16,<1",
]

[project.scripts]
frogify = "frogify.cli.app:main"

[project.urls]
Homepage = "https://github.com/wittg3n/frogify-cli"
Documentation = "https://github.com/wittg3n/frogify-cli/tree/main/docs"
Repository = "https://github.com/wittg3n/frogify-cli"
Issues = "https://github.com/wittg3n/frogify-cli/issues"
Changelog = "https://github.com/wittg3n/frogify-cli/blob/main/CHANGELOG.md"

[dependency-groups]
binary-build = [
    "ninja==1.13.2",
    "pyinstaller==6.22.0",
    "scikit-build-core==1.0.3",
]
dev = ["pyright>=1.1.400", "pytest>=9.0.3,<10", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["frogify", "mp3juice"]

[tool.hatch.build.targets.sdist]
include = ["/frogify", "/mp3juice", "/tests", "/docs", "/packaging", "/install.sh", "/public/logo.png", "/README.md", "/CONTRIBUTING.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["mp3juice_standalone.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pyright]
include = ["frogify", "mp3juice"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
